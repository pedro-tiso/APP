name: consulta_nf_mr
description: Consulta offline de NF e status do canhoto usando Excel e OCR no Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_picker: ^11.0.2
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - data/planilha_exemplo.xlsx

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#044B83"
  adaptive_icon_foreground: assets/icon.png
